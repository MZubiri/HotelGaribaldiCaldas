services:
  hotel-caldas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel-caldas-app
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
